<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日早報</title>
<meta name="description" content="每日國際新聞早報、美股台股觀察與 AI 科技發展，依日期與分類保存。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e3dfd6;
  --accent: #b4442c; --accent-soft: #f6e5df; --ai: #2c5fb4; --ai-soft: #e1e9f7; --mk: #2e7d5b; --mk-soft: #dfefe6;
  --serif: "Noto Serif TC", serif; --sans: "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --surface: #1f1f1c; --ink: #ecebe6; --muted: #9c9a93; --line: #34332e;
    --accent: #e0775c; --accent-soft: #3a2620; --ai: #7aa2e8; --ai-soft: #1f2a3d; --mk: #6cc39a; --mk-soft: #1d3329;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --surface: #1f1f1c; --ink: #ecebe6; --muted: #9c9a93; --line: #34332e;
  --accent: #e0775c; --accent-soft: #3a2620; --ai: #7aa2e8; --ai-soft: #1f2a3d; --mk: #6cc39a; --mk-soft: #1d3329;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.75 var(--sans); }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
header.top { border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
header.top .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { font: 700 18px var(--serif); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--accent); }
.search { flex: 1; min-width: 0; }
.search input { width: 100%; max-width: 360px; float: right; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.theme { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 8px; width: 36px; height: 34px; cursor: pointer; display: grid; place-items: center; flex: none; }
.layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; padding-top: 32px; padding-bottom: 80px; }
aside h3 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
aside ul { list-style: none; margin: 0 0 28px; padding: 0; }
aside li a { display: block; padding: 4px 10px; border-radius: 6px; text-decoration: none; font-size: 14px; color: var(--muted); }
aside li a:hover { color: var(--ink); }
aside li a.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
aside li a .n { float: right; opacity: .7; }
main h1 { font: 700 30px/1.3 var(--serif); margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 36px 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.sec-h h2 { font: 700 20px var(--serif); margin: 0; }
.sec-h .count { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 14px; scroll-margin-top: 72px; }
.card h4 { font: 700 18px/1.45 var(--serif); margin: 8px 0 10px; }
.card p { margin: 0 0 10px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); text-decoration: none; }
.tag.ai { background: var(--ai-soft); color: var(--ai); }
.tag.markets { background: var(--mk-soft); color: var(--mk); }
.why.markets { border-color: var(--mk); }
.outlook h3 { font: 700 17px var(--serif); margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
.mood { font: 500 12px var(--sans); padding: 2px 10px; border-radius: 99px; background: var(--mk-soft); color: var(--mk); }
.why { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--ink); }
.why.ai { border-color: var(--ai); }
.why b { font-weight: 700; }
.srcs { font-size: 13px; color: var(--muted); margin-top: 8px; }
.srcs a { color: var(--muted); }
.obs { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; white-space: pre-line; }
details.allsrc { margin-top: 28px; font-size: 14px; }
details.allsrc summary { cursor: pointer; color: var(--muted); }
details.allsrc ul { padding-left: 18px; }
.daynav { display: flex; justify-content: space-between; margin-top: 32px; font-size: 14px; }
.daynav a { text-decoration: none; color: var(--muted); }
.list-row { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.list-row .d { color: var(--muted); font-size: 13px; margin-right: 8px; }
.empty { color: var(--muted); padding: 40px 0; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; gap: 0; padding-top: 20px; }
  aside { order: 2; border-top: 1px solid var(--line); padding-top: 24px; margin-top: 24px; }
  main h1 { font-size: 24px; }
  .card { padding: 16px; }
  .search input { max-width: none; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">每日<span>早報</span></a>
  <div class="search"><input id="q" type="search" placeholder="搜尋所有日期的標題…" aria-label="搜尋"></div>
  <button class="theme" id="theme" aria-label="切換深淺色"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
</div></header>
<div class="wrap layout">
  <aside id="side"></aside>
  <main id="main"><p class="empty">載入中…</p></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (d) => d.replaceAll("-", "/");
let INDEX = null;
const cache = {};

try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
};

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + " " + r.status);
  return r.json();
}
async function getDay(date) {
  return cache[date] || (cache[date] = await getJSON(`data/${date}.json`));
}

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [kind, ...rest] = h.split("/");
  const arg = rest.join("/");
  if (kind === "cat") return { view: "cat", arg };
  if (kind === "search") return { view: "search", arg };
  if (/^\d{4}-\d{2}-\d{2}$/.test(kind)) return { view: "day", arg: kind, anchor: arg };
  return { view: "day", arg: INDEX.days[0]?.date };
}

function catCounts() {
  const c = {};
  for (const d of INDEX.days) for (const it of d.items) c[it.category] = (c[it.category] || 0) + 1;
  return c;
}

function renderSide(r) {
  const counts = catCounts();
  const sec = (title, cats, sid) => `<h3>${title}</h3><ul>${cats.map((c) =>
    `<li><a href="#/cat/${encodeURIComponent(c)}" class="${r.view === "cat" && r.arg === c ? "on" : ""}">${esc(c)}<span class="n">${counts[c] || 0}</span></a></li>`).join("")}</ul>`;
  const days = INDEX.days.slice(0, 30).map((d) =>
    `<li><a href="#/${d.date}" class="${r.view === "day" && r.arg === d.date ? "on" : ""}">${fmt(d.date)}</a></li>`).join("");
  $("#side").innerHTML = sec("國際新聞分類", INDEX.categories.world) + sec("股市分類", INDEX.categories.markets || []) + sec("AI 科技分類", INDEX.categories.ai) +
    `<h3>歷史早報</h3><ul>${days}</ul>`;
}

function card(item, sid, anchor) {
  const ai = sid === "world" ? "" : " " + sid;
  return `<article class="card" id="${anchor}">
    <a class="tag${ai}" href="#/cat/${encodeURIComponent(item.category)}">${esc(item.category)}</a>
    <h4>${esc(item.title)}</h4>
    <p>${esc(item.summary)}</p>
    <p class="why${ai}"><b>為什麼重要：</b>${esc(item.why)}</p>
    <div class="srcs">來源：${item.sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("・")}</div>
  </article>`;
}

async function renderDay(date, anchor) {
  if (!date) { $("#main").innerHTML = `<p class="empty">還沒有任何早報。</p>`; return; }
  const day = await getDay(date);
  const i = INDEX.days.findIndex((d) => d.date === date);
  const newer = INDEX.days[i - 1], older = INDEX.days[i + 1];
  document.title = `${fmt(date)}｜每日早報`;
  $("#main").innerHTML = `
    <h1>${esc(day.title)}</h1>
    <div class="meta">產生時間 ${esc((day.generated_at || "").replace("T", " ").slice(0, 16))}（台北）</div>
    ${day.sections.map((s) => `
      <div class="sec-h"><h2>${esc(s.name)}</h2><span class="count">${s.items.length} 則</span></div>
      ${s.items.map((it, n) => card(it, s.id, `${s.id}-${n + 1}`)).join("")}
      ${s.outlook ? `<div class="outlook"><h3>美股・台股綜合判斷${s.mood ? `<span class="mood">${esc(s.mood)}</span>` : ""}</h3><div class="obs">${esc(s.outlook)}</div></div>` : ""}`).join("")}
    <div class="sec-h"><h2>綜合觀察</h2></div>
    <div class="obs">${esc(day.observation)}</div>
    <details class="allsrc"><summary>Sources（${day.sources.length}）</summary><ul>
      ${day.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}
    </ul></details>
    <nav class="daynav">
      <span>${older ? `<a href="#/${older.date}">← ${fmt(older.date)}</a>` : ""}</span>
      <span>${newer ? `<a href="#/${newer.date}">${fmt(newer.date)} →</a>` : ""}</span>
    </nav>`;
  if (anchor) document.getElementById(anchor)?.scrollIntoView();
  else scrollTo(0, 0);
}

function renderList(heading, rows) {
  $("#main").innerHTML = `<h1>${esc(heading)}</h1><div class="meta">${rows.length} 則</div>` +
    (rows.length ? rows.map(({ d, it }) =>
      `<a class="list-row" href="#/${d.date}/${it.anchor}"><span class="d">${fmt(d.date)}</span>${esc(it.title)}
       <span class="tag${it.section === "world" ? "" : " " + it.section}">${esc(it.category)}</span></a>`).join("")
      : `<p class="empty">沒有符合的新聞。</p>`);
  scrollTo(0, 0);
}

async function render() {
  const r = route();
  renderSide(r);
  if (r.view === "day") return renderDay(r.arg, r.anchor);
  const rows = [];
  for (const d of INDEX.days) for (const it of d.items) {
    if (r.view === "cat" ? it.category === r.arg : it.title.toLowerCase().includes(r.arg.toLowerCase())) rows.push({ d, it });
  }
  document.title = `${r.arg}｜每日早報`;
  renderList(r.view === "cat" ? r.arg : `搜尋：「${r.arg}」`, rows);
}

let t;
$("#q").addEventListener("input", (e) => {
  clearTimeout(t);
  const v = e.target.value.trim();
  t = setTimeout(() => { location.hash = v ? `#/search/${encodeURIComponent(v)}` : "#/"; }, 250);
});
addEventListener("hashchange", render);
getJSON("data/index.json").then((idx) => { INDEX = idx; render(); })
  .catch((e) => { $("#main").innerHTML = `<p class="empty">無法載入資料：${esc(e.message)}</p>`; });
</script>
</body>
</html>
